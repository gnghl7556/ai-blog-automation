# ============================================================
# AI 블로그 자동화 — 데이터 수집 소스 설정
# 수집 주기: 매 6시간 (4회/일)
# 소스 비중: 해외에서 발견 + 국내 맥락 추가 (균형)
# 버전: v1.0.0
# ============================================================

collection:
  schedule: "0 */6 * * *"  # 매 6시간 (00:00, 06:00, 12:00, 18:00 KST)
  timezone: "Asia/Seoul"

# ═══════════════════════════════════════════════════════════
# 해외 소스
# ═══════════════════════════════════════════════════════════

overseas_sources:

  # ─────────────────────────────────────────────────────────
  # 1. AI 기업 공식 블로그 (원천 소식)
  # ─────────────────────────────────────────────────────────
  ai_company_blogs:
    description: "AI 주요 기업의 공식 발표. 가장 신뢰도 높은 원천 소스."
    priority: "최상"
    collection_method: "rss + web_scraping"

    sources:
      - name: "OpenAI Blog"
        url: "https://openai.com/blog"
        rss: "https://openai.com/blog/rss.xml"
        method: "rss"
        keywords_filter: []  # 전체 수집 (공식 블로그는 모두 중요)
        language: "en"
        note: "GPT 시리즈, DALL-E, Sora 등 신제품/업데이트 발표"

      - name: "Anthropic News"
        url: "https://www.anthropic.com/news"
        rss: null  # RSS 미제공, 웹 스크래핑 필요
        method: "web_scraping"
        scraping_target: "article 목록 페이지"
        language: "en"
        note: "Claude 시리즈 업데이트, 안전성 연구"

      - name: "Google DeepMind Blog"
        url: "https://deepmind.google/discover/blog/"
        rss: null
        method: "web_scraping"
        language: "en"
        note: "Gemini, AlphaFold 등 연구/제품 발표"

      - name: "Meta AI Blog"
        url: "https://ai.meta.com/blog/"
        rss: null
        method: "web_scraping"
        language: "en"
        note: "LLaMA, Segment Anything 등 오픈소스 AI"

      - name: "Microsoft AI Blog"
        url: "https://blogs.microsoft.com/ai/"
        rss: "https://blogs.microsoft.com/ai/feed/"
        method: "rss"
        language: "en"
        note: "Copilot, Azure AI, Windows AI 기능"

  # ─────────────────────────────────────────────────────────
  # 2. 해외 테크/AI 매체 (트렌디 + 대중적)
  # ─────────────────────────────────────────────────────────
  overseas_media:
    description: "대중적이고 트렌디한 AI 뉴스. 조회수 높은 주제 발견에 최적."
    priority: "상"
    collection_method: "rss"

    sources:
      - name: "The Verge - AI"
        url: "https://www.theverge.com/ai-artificial-intelligence"
        rss: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
        method: "rss"
        language: "en"
        strength: "가장 대중적, 바이럴 AI 뉴스, 일반인 눈높이"
        note: "독자 타겟과 가장 유사한 관점. 네이버 글 소재에 특히 적합."

      - name: "TechCrunch - AI"
        url: "https://techcrunch.com/category/artificial-intelligence/"
        rss: "https://techcrunch.com/category/artificial-intelligence/feed/"
        method: "rss"
        language: "en"
        strength: "신규 AI 도구 출시, 스타트업, 투자 소식 빠름"
        note: "도구 리뷰, 뉴스 브리핑 소재에 적합."

      - name: "VentureBeat AI"
        url: "https://venturebeat.com/ai/"
        rss: "https://venturebeat.com/ai/feed/"
        method: "rss"
        language: "en"
        strength: "AI 업계 전문 분석, 트렌드 리포트"
        note: "트렌드 분석, 비교 분석 소재에 적합."

  # ─────────────────────────────────────────────────────────
  # 3. 커뮤니티 (화제성 파악 + 새 도구 발견)
  # ─────────────────────────────────────────────────────────
  communities:
    description: "사람들이 실제로 관심 갖는 주제 파악. 전체 수집 후 에이전트가 필터링."
    priority: "중"
    collection_method: "api + rss"
    filtering: "전체 수집 → 주제 선정 에이전트가 '한국인 관심도' 기준으로 필터링"

    sources:
      - name: "Reddit - r/ChatGPT"
        url: "https://www.reddit.com/r/ChatGPT/"
        rss: "https://www.reddit.com/r/ChatGPT/hot.json"
        method: "reddit_api"
        collect: "hot + top (daily)"
        language: "en"
        note: "ChatGPT 사용자 후기, 팁, 새 기능 반응. 가장 활발."

      - name: "Reddit - r/artificial"
        url: "https://www.reddit.com/r/artificial/"
        rss: "https://www.reddit.com/r/artificial/hot.json"
        method: "reddit_api"
        collect: "hot + top (daily)"
        language: "en"
        note: "일반 AI 뉴스, 토론. 대중적 관심사 파악에 좋음."

      - name: "Reddit - r/MachineLearning"
        url: "https://www.reddit.com/r/MachineLearning/"
        rss: "https://www.reddit.com/r/MachineLearning/hot.json"
        method: "reddit_api"
        collect: "hot + top (daily)"
        language: "en"
        note: "업계 뉴스, 논문 토론. 티스토리 심화 글 소재에 적합."

      - name: "Hacker News"
        url: "https://news.ycombinator.com/"
        api: "https://hn.algolia.com/api/v1/search?tags=story&query=AI"
        method: "api"
        collect: "AI/ML 관련 키워드 필터링, 포인트 50+ 게시글"
        language: "en"
        note: "기술 커뮤니티 화제 파악. 새로운 도구/논문 발견."
        filtering_keywords:
          - "AI"
          - "GPT"
          - "Claude"
          - "LLM"
          - "machine learning"
          - "artificial intelligence"
          - "Gemini"
          - "Copilot"
          - "Midjourney"
          - "Stable Diffusion"

      - name: "Product Hunt - AI"
        url: "https://www.producthunt.com/topics/artificial-intelligence"
        method: "web_scraping"
        collect: "AI 카테고리 일간 Top 10"
        language: "en"
        note: "신규 AI 도구/서비스 발견의 최적 소스. 도구 리뷰 소재."

# ═══════════════════════════════════════════════════════════
# 국내 소스
# ═══════════════════════════════════════════════════════════

domestic_sources:

  # ─────────────────────────────────────────────────────────
  # 4. 국내 IT 매체 (신뢰성 + 전문성)
  # ─────────────────────────────────────────────────────────
  domestic_media:
    description: "한국 실정에 맞는 심도 깊은 전문 보도."
    priority: "상"
    collection_method: "rss + web_scraping"

    sources:
      - name: "AI타임스"
        url: "https://www.aitimes.com/"
        rss: "https://www.aitimes.com/rss/allArticle.xml"
        method: "rss"
        language: "ko"
        strength: "국내 AI 전문 매체 1위, 업계 신뢰도 최고"
        note: "국내 AI 동향, 정책, 기업 소식. 한국 맥락 추가에 핵심."

      - name: "ZDNet Korea - AI"
        url: "https://zdnet.co.kr/news/?lstcode=0000&page=1"
        rss: "https://zdnet.co.kr/rss/all_news.xml"
        method: "rss"
        keywords_filter: ["AI", "인공지능", "챗GPT", "생성AI", "LLM"]
        language: "ko"
        strength: "IT 전문 매체, 기업 분석 깊이"
        note: "기업 도입 사례, 시장 분석. 티스토리 소재에 적합."

      - name: "전자신문 (ET News)"
        url: "https://www.etnews.com/"
        rss: "https://www.etnews.com/rss/Section901.xml"
        method: "rss"
        keywords_filter: ["AI", "인공지능", "생성형", "GPT", "클로드"]
        language: "ko"
        strength: "국내 최대 IT 전문 일간지, 정부 정책/기업 동향"
        note: "국내 AI 정책, 대기업 동향. 트렌드 분석 소재에 적합."

  # ─────────────────────────────────────────────────────────
  # 5. 검색 트렌드 (키워드 인사이트)
  # ─────────────────────────────────────────────────────────
  trend_monitoring:
    description: "사람들이 실제로 검색하는 키워드 추적. 주제 선정 + SEO에 활용."
    priority: "중"
    collection_method: "api"

    sources:
      - name: "네이버 데이터랩"
        url: "https://datalab.naver.com/"
        api: "네이버 검색어 트렌드 API"
        method: "naver_api"
        tracking_keywords:
          - category: "AI 서비스"
            keywords: ["ChatGPT", "챗GPT", "클로드", "제미나이", "코파일럿",
                       "미드저니", "달리", "Sora", "소라AI", "퍼플렉시티"]
          - category: "AI 개념"
            keywords: ["인공지능", "AI", "생성AI", "AI 에이전트", "LLM",
                       "프롬프트", "딥러닝", "머신러닝"]
          - category: "AI 활용"
            keywords: ["AI 글쓰기", "AI 이미지", "AI 영상", "AI 코딩",
                       "AI 업무", "AI 자동화", "AI 번역"]
        collection_schedule: "매일 06:00 (1회/일, 트렌드는 급변하지 않으므로)"
        language: "ko"
        note: "네이버 SEO 키워드 선정에 직접 활용"

      - name: "Google Trends"
        url: "https://trends.google.co.kr/"
        api: "pytrends 라이브러리"
        method: "pytrends"
        tracking_keywords: "(네이버 데이터랩과 동일 키워드를 구글에서도 추적)"
        region: "KR"
        collection_schedule: "매일 06:00 (1회/일)"
        language: "ko"
        note: "구글 SEO(티스토리) 키워드 선정에 활용. 네이버와 비교하여 플랫폼별 키워드 전략 수립."

# ═══════════════════════════════════════════════════════════
# 수집 파이프라인 설정
# ═══════════════════════════════════════════════════════════

pipeline:
  # 수집 → 정제 → 저장 → 필터링 흐름
  steps:
    1_collect:
      description: "각 소스에서 원시 데이터 수집"
      output: "raw_items[]"
      fields:
        - title          # 제목
        - url            # 원본 URL
        - source         # 소스명 (예: "The Verge")
        - source_type    # 소스 유형 (blog, media, community, trend)
        - published_at   # 발행 시간
        - summary        # 요약 (RSS description 또는 첫 2문장)
        - language       # 언어 (en/ko)
        - engagement     # 참여도 (업보트, 댓글 수 등 — 커뮤니티 소스만)

    2_deduplicate:
      description: "중복 제거"
      method: "URL 해시 기반 정확 매칭 + 제목 유사도 80% 이상 제거"
      note: "같은 뉴스를 여러 매체가 보도하는 경우, 원천 소스(기업 블로그) 우선"

    3_translate:
      description: "영어 항목 한국어 번역 (제목 + 요약만)"
      method: "Claude API (간단 번역, 비용 절감)"
      note: "본문 전체 번역은 리서치 단계에서 수행"

    4_store:
      description: "DB에 저장"
      table: "raw_topics"
      status: "collected"

    5_filter:
      description: "주제 선정 에이전트에게 전달"
      trigger: "매일 07:00 (콘텐츠 생성 파이프라인 시작 전)"
      agent: "topic_curator_agent"
      filtering_criteria: |
        주제 선정 에이전트가 다음 기준으로 필터링:
        1. 한국인 관심도: 한국 독자가 궁금해할 만한 주제인가?
        2. 대중성: 완전 일반인도 관심 가질 만한가?
        3. 시의성: 지금 다뤄야 의미 있는 타이밍인가?
        4. 블로그 적합성: 우리 카테고리(제품, 기술, 활용)에 맞는가?
        5. 차별화: 이미 한국어 블로그에 많이 다뤄진 주제가 아닌가?
        6. 트렌드 연계: 네이버/구글 검색 트렌드 상승 키워드와 관련 있는가?

# ═══════════════════════════════════════════════════════════
# 수집 소스별 구현 방식 요약
# ═══════════════════════════════════════════════════════════

implementation_summary:
  rss_sources:
    count: 7
    list:
      - "OpenAI Blog"
      - "Microsoft AI Blog"
      - "The Verge AI"
      - "TechCrunch AI"
      - "VentureBeat AI"
      - "AI타임스"
      - "ZDNet Korea"
    library: "feedparser (Python)"
    note: "가장 안정적이고 구현 간단. 우선 구현."

  web_scraping_sources:
    count: 4
    list:
      - "Anthropic News"
      - "Google DeepMind Blog"
      - "Meta AI Blog"
      - "Product Hunt AI"
    library: "Playwright 또는 BeautifulSoup"
    note: "사이트 구조 변경 시 스크래퍼 수정 필요. 모니터링 필수."

  api_sources:
    count: 2
    list:
      - "Reddit (3개 서브레딧)"
      - "Hacker News (Algolia API)"
    library: "requests + Reddit API (PRAW)"
    note: "Reddit API는 rate limit 주의 (분당 60회)."

  trend_sources:
    count: 2
    list:
      - "네이버 데이터랩 (네이버 API)"
      - "Google Trends (pytrends)"
    schedule: "매일 1회 (06:00)"
    note: "트렌드는 급변하지 않으므로 1회/일 충분."

  total_sources: 15
  # 기업 블로그 5 + 해외 매체 3 + 커뮤니티 5 + 국내 매체 3 + 트렌드 2
  # (전자신문 RSS 포함)

# ═══════════════════════════════════════════════════════════
# 추후 확장 가능 소스 (Phase 4 이후)
# ═══════════════════════════════════════════════════════════

future_sources:
  - name: "X(Twitter) AI 인플루언서"
    reason: "속보성 강하지만 API 비용 높음"

  - name: "YouTube AI 채널"
    reason: "영상 콘텐츠 트렌드 파악. 스크립트 추출 필요."

  - name: "arxiv (cs.AI, cs.CL)"
    reason: "논문 기반 기술 설명 글에 유용하나, 초기에는 매체 기사로 충분"

  - name: "GitHub Trending"
    reason: "오픈소스 AI 도구 발견. 코딩/개발 AI 카테고리에 유용."

  - name: "Hugging Face Papers"
    reason: "AI 논문 트렌드. 기술 설명 글 소재."
