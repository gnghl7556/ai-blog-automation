# ============================================================
# AI 블로그 자동화 — 썸네일 템플릿 모듈 설정
# 방식: 일관된 템플릿 + 텍스트/배경만 변경
# 버전: v1.0.0
# ============================================================

thumbnail:
  # ── 기본 설정 ──────────────────────────────────────────
  style: "일러스트 (AI 생성 배경 이미지 + 텍스트 오버레이)"
  platform_differentiation: true  # 네이버/티스토리 각각 다른 디자인
  branding_logo: "테스트 후 결정"  # 로고 포함 여부

  # ── 생성 도구 ──────────────────────────────────────────
  background_generator: "테스트 후 결정"  # DALL-E 3 / Stable Diffusion / Midjourney
  text_overlay_tool: "테스트 후 결정"     # Pillow + 한글 폰트 유력
  text_layout: "테스트 후 결정"           # 제목 전체 / 키워드만 / 제목+부제

  # ── 플랫폼별 규격 ──────────────────────────────────────

  naver:
    size: "1200x1200"
    ratio: "1:1 (정사각형)"
    tone: "친근한 느낌"
    color_by_category:
      ai_products: 
        primary: "#3B82F6"    # 파랑 계열
        background_prompt_tone: "밝고 친근한, 부드러운 파스텔 블루 톤"
      ai_technology:
        primary: "#8B5CF6"    # 보라 계열
        background_prompt_tone: "밝고 친근한, 부드러운 파스텔 보라 톤"
      ai_practical:
        primary: "#10B981"    # 초록 계열
        background_prompt_tone: "밝고 친근한, 부드러운 파스텔 그린 톤"
    design_notes: |
      - 전체적으로 밝고 따뜻한 느낌
      - 배경 일러스트: 귀여운/친근한 AI 관련 이미지
      - 텍스트: 굵고 큰 한글 폰트, 가독성 최우선
      - 색상 오버레이로 카테고리 구분 (하단 또는 상단 컬러 바)

  tistory:
    size: "1200x630"
    ratio: "1.91:1 (OG 이미지 표준)"
    tone: "전문적 느낌"
    color_by_category:
      ai_products:
        primary: "#1E40AF"    # 진한 파랑 계열
        background_prompt_tone: "세련되고 전문적인, 딥 블루 톤"
      ai_technology:
        primary: "#6D28D9"    # 진한 보라 계열
        background_prompt_tone: "세련되고 전문적인, 딥 퍼플 톤"
      ai_practical:
        primary: "#047857"    # 진한 초록 계열
        background_prompt_tone: "세련되고 전문적인, 딥 그린 톤"
    design_notes: |
      - 전체적으로 세련되고 차분한 느낌
      - 배경 일러스트: 깔끔한 테크 느낌의 추상적 이미지
      - 텍스트: 정돈된 한글 폰트, 전문 매체 느낌
      - 색상 오버레이로 카테고리 구분

  # ── 생성 파이프라인 ────────────────────────────────────

  pipeline:
    steps:
      1_generate_concept:
        description: "Claude API로 썸네일 컨셉 생성"
        input: "글 제목, 카테고리, 플랫폼"
        output: "배경 이미지 프롬프트, 텍스트 오버레이 문구"

      2_generate_background:
        description: "AI 이미지 생성 도구로 배경 이미지 생성"
        input: "배경 이미지 프롬프트 + 카테고리별 색상 톤"
        output: "배경 이미지 파일 (네이버용 + 티스토리용)"
        constraints:
          - "불쾌하거나 폭력적인 이미지 절대 배제"
          - "친근하고 이해를 돕는 이미지만"
          - "텍스트가 올라갈 영역은 단순하게 (가독성 확보)"

      3_overlay_text:
        description: "배경 위에 텍스트 오버레이"
        input: "배경 이미지 + 텍스트 문구 + 폰트 설정"
        output: "최종 썸네일 이미지"
        text_settings:
          font_candidates:
            - "Noto Sans KR Bold"        # 구글 무료 폰트
            - "Pretendard Bold"           # 국내 인기 무료 폰트
            - "IBM Plex Sans KR Bold"     # 깔끔한 고딕
          text_color: "#FFFFFF"           # 흰색 (기본)
          text_shadow: true               # 가독성 위한 그림자
          max_lines: 2                    # 최대 2줄

      4_add_branding:
        description: "브랜딩 요소 추가 (테스트 후 결정)"
        input: "썸네일 + 로고/블로그명"
        output: "브랜딩 포함 최종 썸네일"
        status: "테스트 후 결정"

      5_resize_export:
        description: "플랫폼별 최종 리사이즈 및 내보내기"
        output_formats:
          naver: "1200x1200, JPEG, 품질 90%"
          tistory: "1200x630, JPEG, 품질 90%"

  # ── AI 배경 이미지 프롬프트 가이드라인 ─────────────────

  background_prompt_guidelines:
    common_rules:
      - "텍스트가 올라갈 중앙 영역은 단순하고 어둡게 (가독성 확보)"
      - "과도하게 복잡한 디테일 금지"
      - "사람 얼굴 포함 금지 (초상권/불쾌감 방지)"
      - "불쾌하거나 폭력적인 요소 절대 금지"
      - "밝고 긍정적인 톤 유지"

    naver_style: |
      친근하고 따뜻한 일러스트 스타일.
      파스텔 톤, 부드러운 그라데이션, 둥근 형태.
      예시 프롬프트: "friendly warm illustration style, soft pastel {category_color} tones,
      abstract AI concept, simple clean background with space for text overlay,
      no text in image, no human faces"

    tistory_style: |
      세련되고 전문적인 테크 일러스트 스타일.
      진한 톤, 기하학적 패턴, 깔끔한 라인.
      예시 프롬프트: "professional tech illustration style, deep {category_color} tones,
      geometric patterns, abstract AI/data visualization concept,
      clean background with space for text overlay,
      no text in image, no human faces, modern minimalist"
