# ============================================================
# GitHub Actions — CI/CD 파이프라인
# main 브랜치 push 시: 테스트 → 빌드 → 서버 배포
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  # ── 1단계: 테스트 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 린트 체크 (기본)
        run: python -m py_compile cli.py
        # TODO: ruff 또는 flake8 추가

      - name: 테스트 실행
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v
          else
            echo "테스트 파일 없음, 스킵"
          fi

  # ── 2단계: 서버 배포 ──
  # VPS 준비되면 아래 주석 해제
  #
  # deploy:
  #   needs: test
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/main'
  #
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: 서버에 배포
  #       uses: appleboy/ssh-action@v1.0.3
  #       with:
  #         host: ${{ secrets.SERVER_HOST }}
  #         username: ${{ secrets.SERVER_USER }}
  #         key: ${{ secrets.SERVER_SSH_KEY }}
  #         script: |
  #           cd ~/ai-blog-automation
  #           git pull origin main
  #           docker compose up -d --build
  #           docker compose logs --tail=20

# ============================================================
# 서버 배포를 위해 GitHub Secrets에 추가할 값:
#
#   SERVER_HOST      — VPS IP 주소 (예: 123.45.67.89)
#   SERVER_USER      — SSH 사용자명 (예: ubuntu)
#   SERVER_SSH_KEY   — SSH 개인키 (서버 접속용)
#
# VPS 초기 세팅 방법은 docs/DEPLOY.md 참조
# ============================================================
